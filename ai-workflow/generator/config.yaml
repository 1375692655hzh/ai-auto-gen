output:
  articles_dir: ../../auto-publisher/autopub/articles
  images_dir: ../../auto-publisher/autopub/images
  scripts_dir: output/口播
  research_dir: output/research
sources:
  sina_7x24:
    enabled: true
    page_size: 100
  eastmoney_fast:
    enabled: true
    page_size: 50
  eastmoney_zaozhidao:
    enabled: true
    keywords:
    - 早知道
  wscn_breakfast:
    enabled: true
    count: 2
  translate:
    enabled: true
    # 模型链: 依次尝试, 前一个失败自动切下一个, 成功后粘性沿用(实测见
    # global-news-sources/docs/翻译模型实测与推荐.md)。每项 base_url/api_key/model
    # 均可自填, 留空继承全局配置(secret.local.json); models 为空则退回单 model 行为。
    models:
    - model: deepseek-v4-flash          # 主力(全局 key)
    - base_url: http://127.0.0.1:20128/v1   # 备胎1(免费): OmniRoute 本地网关(npm i -g omniroute
      api_key: omniroute-local          #   && omniroute serve --daemon), 零 key 走 OpenCode Free 池;
      model: oc/muse-spark-1.2-contributor-free  # 未装/未启动时秒级失败, 自动落备胎2
    - model: glm-5.3-flash              # 备胎2: 质量同档, 走套餐额度(慢)
    batch: 10
    max_chars: 1500
    round_cap: 120
morning:
  max_items: 60
  article_hint: 800-1200字,分板块,每条要闻带时间
  script_seconds: 90
daily:
  items: 15
analysis:
  max_items: 80
  min_related_items: 3
  article_hint: 1500-2500字,深度分析,有观点有论据
  script_seconds: 120
