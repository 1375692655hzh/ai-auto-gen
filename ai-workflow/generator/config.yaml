output:
  articles_dir: ../../auto-publisher/autopub/articles
  images_dir: ../../auto-publisher/autopub/images
  scripts_dir: output/口播
  research_dir: output/research
sources:
  sina_7x24:
    enabled: true
    page_size: 100
  eastmoney_fast:
    enabled: true
    page_size: 50
  eastmoney_zaozhidao:
    enabled: true
    keywords:
    - 早知道
  wscn_breakfast:
    enabled: true
    count: 2
  translate:
    enabled: true
    # 模型链: 依次尝试, 前一个失败自动切下一个, 成功后粘性沿用(实测见
    # global-news-sources/docs/翻译模型实测与推荐.md)。每项 base_url/api_key/model
    # 均可自填, 留空继承全局配置(secret.local.json); models 为空则退回单 model 行为。
    # 免费优先链(2026-09-04 拍板): 免费池先行, 付费兜底, 按批无缝切换(失败自动落下一位,
    # 成功粘性沿用)。glm 出局(慢且套餐额度留给生成)。DS 官方按量位默认注释——要用就在
    # 本机 config.local.yaml(gitignored) 自填 base_url/api_key/model 全链覆盖。
    models:
    - base_url: http://127.0.0.1:20128/v1   # 主力(免费): OmniRoute 本地网关(npm i -g omniroute
      api_key: omniroute-local          #   && omniroute serve --daemon) → OpenCode Free 池;
      model: oc/muse-spark-1.2-contributor-free  # 网关未启动=秒级失败, 无缝落备胎1
    # - base_url: https://api.deepseek.com/v1   # 备胎1(按量): DS 官网位, 自填三字段后取消注释
    #   api_key: sk-xxxxxxxx
    #   model: deepseek-v4-flash
    - model: deepseek-v4-flash          # 备胎2: Ark 套餐(全局 key)
    - base_url: http://127.0.0.1:20128/v1   # 备胎3(免费): OmniRoute → mimo(偶带```json围栏,
      api_key: omniroute-local          #   解析正则已兜住; 输出带 reasoning_content 但不进译文)
      model: oc/mimo-v2.5-free
    batch: 10
    max_chars: 1500
    round_cap: 120
morning:
  max_items: 60
  article_hint: 800-1200字,分板块,每条要闻带时间
  script_seconds: 90
daily:
  items: 15
analysis:
  max_items: 80
  min_related_items: 3
  article_hint: 1500-2500字,深度分析,有观点有论据
  script_seconds: 120
