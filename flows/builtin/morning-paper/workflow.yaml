id: morning-paper
title: AI财经早报
description: 抓取→粗筛→精排→联网取证→扩写解读→数字校验→图文日报+口播稿(+视频)
version: 1.0.0

# 参数: 可被 data/config.local.yaml 或命令行 --set k=v 覆盖
params:
  items: 15            # 每日条数(0=取 config daily.items)
  peer_sources: ""     # 早报源选取: 空=全部14源; 逗号分隔源名=只抓指定(如 "鉅亨台股,SMM大宗商品")
  flash_sources: ""    # 快讯源选取: 空=全部启用快讯; 逗号分隔源id=只抓指定(如 "jin10_flash,investinglive_flash")
  with_video: false    # 是否接视频成片
  no_voice: false      # 不生成口播稿
  rank_model: ark:kimi-k3   # 精排模型(2026-08-30 素材链横评定选, 见 docs/素材链模型选型.md): 空=默认通道
  expand_model: ark:kimi-k3 # 扩写模型(同上)

steps:
  - id: fetch                      # 快讯+同行早报(免 LLM)
    uses: fetch_news
    with: {peer_sources: "{params.peer_sources}", flash_sources: "{params.flash_sources}"}
  - id: extras                     # 日历/外围/公告(版式板块)
    uses: fetch_extras
  - id: rank                       # LLM 精排选条
    uses: rank_items
    with: {items: "{params.items}", model: "{params.rank_model}"}
  - id: expand                     # 并行扩写(联网取证+AI解读+数字校验)
    uses: expand_entries
    with: {workers: 2, model: "{params.expand_model}"}
  - id: assemble                   # 图文+口播+daily JSON  ← 审核点
    uses: assemble_daily
    review: true
    with: {no_voice: "{params.no_voice}"}
  - id: formats                    # 长图/群发模板/同行式早报文章
    uses: render_formats
  - id: video                      # 一键成片(可关)
    uses: render_video
    when: "{params.with_video}"
