id: morning-digest
title: 早报汇总(四源合成)
description: 抓取财联社有声早报/华尔街见闻早餐/富途早报/元宝Gangtise四份早报 → 汇总分类成知识素材 → 按产出形式渲染(文章等)
version: 1.2.0

params:
  format: article         # 产出形式: article=渲染早报文章(成品进待发队列) / material=只要知识素材
  wscn_count: 2           # 华尔街见闻早餐取几篇(通常当天1篇)
  per_report_chars: 6000  # 每份早报送入模型的最大字数
  tag_lines: true         # 解读标签开关(失败自动降级为无解读版)
  tag_mode: direction     # direction=板块×方向(利好/利空/中性) / sectors=只写板块不写多空
  tag_model: ark:kimi-k3   # 打标模型(11模型横评定选, 见 docs/打标模型选型.md): 空=默认GLM / ark:<模型名>=方舟订阅; 失败自动回落
  with_image: false       # 长图产物(按需; 图片是文章的额外产物类别)
  image_top: 16           # 图条上限(配额内截断)

steps:
  - id: fetch                    # 四源抓取(免 LLM, gangtise 失败自动元宝兜底)
    uses: fetch_morning_reports
    with: {wscn_count: "{params.wscn_count}"}
  - id: synth                    # LLM 汇总分类 → 知识素材(存档, 不进队列)
    uses: synthesize_morning
    with: {per_report_chars: "{params.per_report_chars}"}
  - id: article                  # 素材 → 早报文章(标签:详情格式, 进待发队列)
    uses: render_morning_article
    when: "{params.format}"
  - id: tag                      # 文章 → 逐条解读标签(板块×方向)+公告热度汇总  ← 审核点
    uses: tag_morning_items
    when: "{params.format}"
    with: {enabled: "{params.tag_lines}", mode: "{params.tag_mode}", model: "{params.tag_model}"}
    review: true
  - id: image                    # 文章+解读 → 早报长图(按需, PNG 不进待发队列; 可离线重渲染)
    uses: render_morning_image
    when: "{params.with_image}"
    with: {top: "{params.image_top}"}
