id: morning-digest
title: 早报汇总(四源合成)
description: "四源(发布时间：财联社~07:00/见闻~07:02/富途08:20-08:26/Gangtise全天) → 汇总分类成素材 → 文章+解读+长图。定时跑周一至五08:30(等最晚的富途+日韩已开盘, 详见docs/早报自动化时间.md)"
version: 1.3.0

params:
  format: article         # 产出形式: article=渲染早报文章(成品进待发队列) / material=只要知识素材
  peer_sources: ""        # 早报源选取: 空=全部14源; 逗号分隔源名=只抓指定(如 "鉅亨台股,SMM大宗商品,AA英文晨报")
  wscn_count: 2           # 华尔街见闻早餐取几篇(通常当天1篇)
  per_report_chars: 6000  # 每份早报送入模型的最大字数
  tag_lines: true         # 解读标签开关(失败自动降级为无解读版)
  tag_mode: direction     # direction=板块×方向(利好/利空/中性) / sectors=只写板块不写多空
  synth_model: ark:kimi-k3  # 素材分类模型(实测deepseek-v4-pro是旧默认且分类激进, kimi-k3横评最优)
  article_model: ark:kimi-k3 # 文章标签模型
  tag_model: ark:kimi-k3   # 打标模型(11模型横评定选, 见 docs/打标模型选型.md): 空=kimi-k3(生成链默认, data/config.local.yaml gen_model 可覆盖); ark:<名>=订阅; 失败降kimi官方API再降默认通道
  with_image: false       # 长图产物(按需; 图片是文章的额外产物类别)
  image_top: 16           # 图条上限(配额内截断)
  with_video: false       # 视频产物(按需; 依赖 with_image, 独立口播稿+原文详情, 女声晓晓)
  video_top: 7            # 口播条数上限(3重200字+4轻130字, ~5分钟)
  enrich_model: ark:kimi-k3  # 扩写模型(空=kimi-k3(生成链默认); 订阅额度)

steps:
  - id: fetch                    # 四源抓取(免 LLM, gangtise 失败自动元宝兜底)
    uses: fetch_morning_reports
    with: {wscn_count: "{params.wscn_count}", peer_sources: "{params.peer_sources}"}
  - id: synth                    # LLM 汇总分类 → 知识素材(存档, 不进队列)
    uses: synthesize_morning
    with: {per_report_chars: "{params.per_report_chars}", model: "{params.synth_model}"}
  - id: article                  # 素材 → 早报文章(标签:详情格式, 进待发队列)
    uses: render_morning_article
    when: "{params.format}"
    with: {model: "{params.article_model}"}
  - id: tag                      # 文章 → 逐条解读标签(板块×方向)+公告热度汇总  ← 审核点
    uses: tag_morning_items
    when: "{params.format}"
    with: {enabled: "{params.tag_lines}", mode: "{params.tag_mode}", model: "{params.tag_model}"}
    review: true
  - id: image                    # 文章+解读 → 早报长图(按需, PNG 不进待发队列; 可离线重渲染)
    uses: render_morning_image
    when: "{params.with_image}"
    with: {top: "{params.image_top}"}
  - id: enrich                   # 文章选中条+素材 → 结构化口播内容(概括/指标卡/背景进展影响) ← LLM
    uses: enrich_video_details
    when: "{params.with_video}"
    with: {top: "{params.video_top}", model: "{params.enrich_model}"}
  - id: script                   # 口播稿装配(单一文本源, 零LLM)  ← 审核点(过稿才出片)
    uses: render_morning_script
    when: "{params.with_video}"
    with: {top: "{params.video_top}"}
    review: true
  - id: video                    # 过稿口播稿 → 出片(零LLM, 音画一致构造保证; 改稿 --from video)
    uses: render_morning_video
    when: "{params.with_video}"
